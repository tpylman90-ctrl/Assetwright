name: Forge Mini v10 — Continued Physical Geometry Learning

# No random reset: source-SHA confirmed previous v8 adapter learned weights
# + frozen source-hashed v9 form identifier. Fresh 1808 original Kotlin GLBs,
# 288 untouched blind native deformations. 6x300s CPU optimizer sessions.
# Development selects methods; independent Kotlin GLBs validate 3D surface.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forge-mini-v10-continued-geometry-learning.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: assetwright-v10-physical-continuation-training
  cancel-in-progress: false

jobs:
  continue-geometry-weights-and-audit:
    name: Train 6 real native geometry continuation sessions; reconstruct 1152 original GLBs
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      ASSETWRIGHT_DINO_STUDY: geometry_mastery_v10
      ASSETWRIGHT_GEOMETRY_MASTERY_PREDICTIONS: ${{ github.workspace }}/local-data/geometry_mastery_v10/student/native_proposals.properties
      ASSETWRIGHT_GEOMETRY_MASTERY_RECON: ${{ github.workspace }}/local-data/geometry_mastery_v10/reconstructed
      GH_TOKEN: ${{ github.token }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Require new original v10 geometry source cohort finished
        run: gh run watch 42481115566 --repo "$GITHUB_REPOSITORY" --exit-status
      - name: Fetch NEW original 1808 Kotlin GLBs and aligned source views
        uses: actions/download-artifact@v4
        with:
          name: forge-mini-v10-1808-fresh-original-eight-form-sources
          repository: tpylman90-ctrl/Assetwright
          run-id: 42481115566
          github-token: ${{ github.token }}
          path: local-data/geometry_mastery_v10/new/
      - name: Recover previous v8 correct TRAINING-only source forms and images
        run: |
          mkdir -p local-data/geometry_mastery_v10/old
          gh run download 42267694590 --repo "$GITHUB_REPOSITORY" \
            --name forge-mini-v8-1808-original-eight-form-sources \
            --dir local-data/geometry_mastery_v10/old
          test -s local-data/geometry_mastery_v10/old/manifest.json
          test -s local-data/geometry_mastery_v10/old/identity/index.json
          test -s training/learning_runs/form_fidelity_v8_42396471403/hard_physical.safetensors
          test -s training/learning_runs/identity_continuation_v9_42445878521/replay_continuation.safetensors
          test -s training/learning_runs/multiform_v6_42151392636/balanced_forms.safetensors
          test -s training/learning_runs/shape_identity_v7_42233349361/hard_form_distinctions.safetensors
      - name: Install free CPU PyTorch, safetensors and physical geometry audit requirements
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          python -m pip install 'Pillow==11.3.0' 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'safetensors>=0.4,<1'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile source, trainer, 3D audit and independent research gates
        run: |
          python -m compileall -q \
            tools/mini_ai/native_geometry_mastery_v10.py \
            tools/mini_ai/native_geometry_mastery_forward_audit.py \
            tools/mini_ai/native_geometry_mastery_acceptance.py \
            tools/mini_ai/retain_geometry_mastery_v10.py \
            tools/mini_ai/test_native_geometry_mastery_v10.py \
            tools/mini_ai/test_native_geometry_mastery_acceptance.py
          python -m unittest discover -s tools/mini_ai \
            -p 'test_native_geometry_mastery_v10.py' -v
          python -m unittest discover -s tools/mini_ai \
            -p 'test_native_geometry_mastery_acceptance.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("local-data/geometry_mastery_v10/new")
          m=json.loads((root/"manifest.json").read_text())
          i=json.loads((root/"identity/index.json").read_text())
          assert m["study_id"]=="geometry_mastery_v10"
          assert m["source_count"]==1808 and m["paired_examples"]==1728
          assert m["external_geometry_used"] is False
          assert i["source_count"]==80 and i["study_id"]=="geometry_mastery_v10"
          assert {x:sum(y["split"]==x for y in m["records"])
                  for x in ("train","development","validation")}=={
                    "train":1152,"development":288,"validation":288}
          print("Original v10 8-form source families and unseen blind GLBs verified",flush=True)
          PY
      - name: 1800 actual optimizer seconds from saved v8 geometry weights, old replay and v9 frozen identity
        run: |
          python -u tools/mini_ai/native_geometry_mastery_v10.py \
            --new-manifest local-data/geometry_mastery_v10/new/manifest.json \
            --new-images local-data/geometry_mastery_v10/new/images \
            --new-views local-data/geometry_mastery_v10/new/identity \
            --new-source local-data/geometry_mastery_v10/new/source \
            --old-manifest local-data/geometry_mastery_v10/old/manifest.json \
            --old-images local-data/geometry_mastery_v10/old/images \
            --old-views local-data/geometry_mastery_v10/old/identity \
            --old-source local-data/geometry_mastery_v10/old/source \
            --v6-knowledge training/learning_runs/multiform_v6_42151392636 \
            --v7-knowledge training/learning_runs/shape_identity_v7_42233349361 \
            --v8-knowledge training/learning_runs/form_fidelity_v8_42396471403 \
            --v9-knowledge training/learning_runs/identity_continuation_v9_42445878521 \
            --out local-data/geometry_mastery_v10/student \
            --training-seconds 1800
      - name: Reconstruct ALL 1152 actual original Kotlin GLBs from frozen shape and predicted geometry
        run: |
          test -s "$ASSETWRIGHT_GEOMETRY_MASTERY_PREDICTIONS"
          gradle :app:testDebugUnitTest \
            --tests com.assetwright.app.mini.DinoGeometryMasteryReconstructionTest \
            --rerun-tasks --stacktrace
          test "$(find local-data/geometry_mastery_v10/reconstructed -maxdepth 1 -name '*.glb' | wc -l)" -eq 1152
      - name: Independently compare source SHA, form topology, and true 3D surface Chamfer on 1152 GLBs
        run: |
          python tools/mini_ai/native_geometry_mastery_forward_audit.py \
            --source local-data/geometry_mastery_v10/new/source \
            --reconstructed local-data/geometry_mastery_v10/reconstructed \
            --out local-data/geometry_mastery_v10/forward_audit.json
      - name: Never promote without real improved 3D geometry and no old-skill regression
        run: |
          python tools/mini_ai/native_geometry_mastery_acceptance.py \
            --evaluation local-data/geometry_mastery_v10/student/evaluation.json \
            --geometry local-data/geometry_mastery_v10/forward_audit.json \
            --lineage local-data/geometry_mastery_v10/student/lineage.json \
            --out local-data/geometry_mastery_v10/student/research_disposition.json
      - name: Retain ALL three real v10 learned weights regardless of research eligibility
        run: |
          python tools/mini_ai/retain_geometry_mastery_v10.py \
            --workspace local-data/geometry_mastery_v10 \
            --v6 training/learning_runs/multiform_v6_42151392636 \
            --v7 training/learning_runs/shape_identity_v7_42233349361 \
            --v8 training/learning_runs/form_fidelity_v8_42396471403 \
            --v9 training/learning_runs/identity_continuation_v9_42445878521 \
            --out "training/learning_runs/geometry_mastery_v10_$GITHUB_RUN_ID" \
            --run-id "$GITHUB_RUN_ID"
          git config user.name "AssetWright original geometry research bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "training/learning_runs/geometry_mastery_v10_$GITHUB_RUN_ID"
          git commit -m "research: preserve 1800s continued neural geometry weights and 1152 native 3D GLBs [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:refs/heads/main
      - name: Preserve source-hashed research data even if final modeling gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-mini-v10-continued-weights-and-1152-real-native-GLBs
          path: |
            local-data/geometry_mastery_v10/student/*.json
            local-data/geometry_mastery_v10/student/*.properties
            local-data/geometry_mastery_v10/student/winners/*.safetensors
            local-data/geometry_mastery_v10/student/sessions/*.safetensors
            local-data/geometry_mastery_v10/forward_audit.json
            local-data/geometry_mastery_v10/reconstructed/*.glb
            local-data/geometry_mastery_v10/reconstructed/*.json
            training/learning_runs/geometry_mastery_v10_*/**
          if-no-files-found: warn
          retention-days: 45
