name: Forge CC0 Asset Study

on:
  push:
    paths:
      - "training/requests/forge_cycle.json"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: forge-study-${{ github.ref }}
  cancel-in-progress: false

jobs:
  study:
    name: Collect and inspect licensed shape references
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out Assetwright code and review request
        uses: actions/checkout@v4

      - name: Link running Forge study to GitHub commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="forge/cc0-shape-study" \
            -f description="Forge source-matched mesh and preview study running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify offline safety tests
        run: |
          python -m unittest discover -s tools/mini_ai -p "test_*.py"

      - name: Install free Blender for mesh feature extraction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender libegl1 libgl1-mesa-dri libopengl0 xvfb xauth
          blender -b --factory-startup --disable-autoexec --python-expr "import bpy; print('BLENDER_READY', bpy.app.version_string)"

      - name: Restore previous CC0 descriptor history
        uses: actions/cache/restore@v4
        with:
          path: local-data/mini-ai/forge-study/dataset.json
          key: forge-cc0-descriptors-${{ github.run_id }}
          restore-keys: |
            forge-cc0-descriptors-

      - name: Catalog all licensed model descriptions and source geometry metadata
        run: |
          python tools/mini_ai/descriptive_catalog.py \
            --out local-data/mini-ai/forge-study/descriptive_catalog.json \
            --report local-data/mini-ai/forge-study/descriptive_catalog_report.json \
            --history local-data/mini-ai/forge-study/dataset.json

      - name: Index 3D descriptions and study relevant references
        run: |
          python tools/mini_ai/semantic_reference_search.py \
            --catalog local-data/mini-ai/forge-study/descriptive_catalog.json \
            --out local-data/mini-ai/forge-study/reference_search_demo.json

      - name: Train supervised description to coarse 3D proportions
        run: |
          python tools/mini_ai/description_shape_train.py \
            --catalog local-data/mini-ai/forge-study/descriptive_catalog.json \
            --out local-data/mini-ai/forge-study/text_shape_prior

      - name: Study selected CC0 models with Poly Haven's official API
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" python tools/mini_ai/forge_asset_cycle.py \
            --request training/requests/forge_cycle.json \
            --output local-data/mini-ai/forge-study/report.json \
            --history local-data/mini-ai/forge-study/dataset.json \
            --previews-dir local-data/mini-ai/forge-study/review_previews

      - name: Merge historical geometry descriptors (no source models)
        run: |
          python tools/mini_ai/study_dataset.py \
            --current local-data/mini-ai/forge-study/report.json \
            --previous local-data/mini-ai/forge-study/dataset.json \
            --out local-data/mini-ai/forge-study/dataset.json

      - name: Cache derived history for subsequent training cycles
        uses: actions/cache/save@v4
        with:
          path: local-data/mini-ai/forge-study/dataset.json
          key: forge-cc0-descriptors-${{ github.run_id }}

      - name: Ground descriptions against inspected CC0 Blender meshes
        run: |
          python tools/mini_ai/descriptive_catalog.py \
            --out local-data/mini-ai/forge-study/grounded_descriptions.json \
            --report local-data/mini-ai/forge-study/grounded_description_coverage.json \
            --history local-data/mini-ai/forge-study/dataset.json
          python tools/mini_ai/grounded_geometry_pairs.py \
            --catalog local-data/mini-ai/forge-study/grounded_descriptions.json \
            --study local-data/mini-ai/forge-study/dataset.json \
            --current-report local-data/mini-ai/forge-study/report.json \
            --out local-data/mini-ai/forge-study/grounded_pairs/pairs.json \
            --report local-data/mini-ai/forge-study/grounded_pairs/coverage.json

      - name: Create source-verified semantic component review queue
        run: |
          python tools/mini_ai/component_review_gate.py \
            --pairs local-data/mini-ai/forge-study/grounded_pairs/pairs.json \
            --out local-data/mini-ai/forge-study/grounded_pairs/review_queue.json \
            --report local-data/mini-ai/forge-study/grounded_pairs/review_report.json

      - name: Train source-heldout caption to Blender mesh descriptors
        run: |
          python tools/mini_ai/caption_mesh_train.py \
            --pairs local-data/mini-ai/forge-study/grounded_pairs/pairs.json \
            --out local-data/mini-ai/forge-study/caption_mesh_prior

      - name: Train held-out evaluated geometry prior
        run: |
          python tools/mini_ai/shape_prior_train.py \
            --report local-data/mini-ai/forge-study/dataset.json \
            --out local-data/mini-ai/forge-study/prior

      - name: Train source-disjoint component relationship prior
        run: |
          python tools/mini_ai/relation_prior_train.py \
            --report local-data/mini-ai/forge-study/dataset.json \
            --out local-data/mini-ai/forge-study/relations

      - name: Publish downloadable research report
        uses: actions/upload-artifact@v4
        with:
          name: forge-cc0-shape-study
          path: |
            local-data/mini-ai/forge-study/descriptive_catalog.json
            local-data/mini-ai/forge-study/descriptive_catalog_report.json
            local-data/mini-ai/forge-study/reference_search_demo.json
            local-data/mini-ai/forge-study/text_shape_prior/*.json
            local-data/mini-ai/forge-study/report.json
            local-data/mini-ai/forge-study/dataset.json
            local-data/mini-ai/forge-study/grounded_description_coverage.json
            local-data/mini-ai/forge-study/grounded_pairs/*.json
            local-data/mini-ai/forge-study/review_previews/**/*.png
            local-data/mini-ai/forge-study/caption_mesh_prior/*.json
            local-data/mini-ai/forge-study/prior/*.json
            local-data/mini-ai/forge-study/relations/*.json
          retention-days: 30
          if-no-files-found: error

      - name: Report study failures with a linked GitHub status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context="forge/cc0-shape-study" \
            -f description="Forge study failed; inspect this Actions run" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish study run URL
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="forge/cc0-shape-study" \
            -f description="CC0 text/mesh pairs and component label review gate; Android unchanged" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
