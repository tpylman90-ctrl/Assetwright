name: AssetWright Zero-to-CAD Construction Teacher

on:
  push:
    branches: [main]
    paths:
      - 'tools/mini_ai/zero_to_cad_*.py'
      - 'tools/mini_ai/test_zero_to_cad.py'
      - '.github/workflows/zero-to-cad-teacher.yml'
      - 'training/requests/zero_to_cad.json'
  workflow_dispatch:
    inputs:
      run_cad_research:
        description: 'Bounded public CAD lessons and frozen DINOv2 teacher'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: assetwright-zero-to-cad-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-source-safety:
    name: Test safe parser, provenance and split gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tools/mini_ai -p 'test_*.py'

  bounded-cpu-study:
    name: Open CAD operations and frozen DINOv2 features
    needs: verify-source-safety
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.run_cad_research) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[study-zero-to-cad]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU and open-dataset dependencies
        run: |
          python -m pip install --upgrade 'datasets>=3.0,<5.0' 'transformers>=4.45,<5' 'Pillow>=10,<13' 'safetensors>=0.4,<1'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Stream bounded, safe CAD training lessons
        run: |
          python tools/mini_ai/zero_to_cad_ingest.py \
            --split train --max-records 96 --max-scan 384 \
            --images local-data/zero-to-cad/images \
            --output local-data/zero-to-cad/train.json
      - name: Stream independent validation examples
        run: |
          python tools/mini_ai/zero_to_cad_ingest.py \
            --split validation --max-records 40 --max-scan 160 \
            --images local-data/zero-to-cad/images \
            --output local-data/zero-to-cad/validation.json
      - name: Fit our own CAD operation grammar and compare heldout predictive loss
        run: |
          python tools/mini_ai/zero_to_cad_operation_student.py \
            --train local-data/zero-to-cad/train.json \
            --validation local-data/zero-to-cad/validation.json \
            --out local-data/zero-to-cad/student
      - name: Extract frozen DINOv2-small features without external mesh generation
        run: |
          python tools/mini_ai/zero_to_cad_dinov2_teacher.py \
            --manifest local-data/zero-to-cad/train.json \
            --images local-data/zero-to-cad/images \
            --out local-data/zero-to-cad/dinov2/frozen_features.json
      - name: Extract independent heldout DINOv2 shape-teacher features
        run: |
          python tools/mini_ai/zero_to_cad_dinov2_teacher.py \
            --manifest local-data/zero-to-cad/validation.json \
            --images local-data/zero-to-cad/images \
            --out local-data/zero-to-cad/dinov2/validation_frozen_features.json
      - name: Distill frozen visual shape features into our own construction student
        run: |
          python tools/mini_ai/zero_to_cad_visual_student.py \
            --train local-data/zero-to-cad/train.json \
            --train-teacher local-data/zero-to-cad/dinov2/frozen_features.json \
            --validation local-data/zero-to-cad/validation.json \
            --validation-teacher local-data/zero-to-cad/dinov2/validation_frozen_features.json \
            --out local-data/zero-to-cad/visual-student
      - name: Translate independently validated CAD knowledge into bounded original native operation
        run: |
          python tools/mini_ai/zero_to_cad_native_bridge.py \
            --grammar local-data/zero-to-cad/student/validated_grammar.json \
            --visual local-data/zero-to-cad/visual-student/validated_visual_student.json \
            --out local-data/zero-to-cad/native-bridge
      - name: Upload only licensed research metadata and evaluations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assetwright-zero-to-cad-dinov2-research
          path: |
            local-data/zero-to-cad/train.json
            local-data/zero-to-cad/validation.json
            local-data/zero-to-cad/student/*.json
            local-data/zero-to-cad/dinov2/*.json
            local-data/zero-to-cad/visual-student/*.json
            local-data/zero-to-cad/native-bridge/*.json
            local-data/zero-to-cad/native-bridge/*.properties
          if-no-files-found: warn
          retention-days: 21


  native-operator-proof:
    name: Construct and audit original GLBs from validated native-operation proposal
    needs: bounded-cpu-study
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ASSETWRIGHT_SOCKET_BENCHMARK_OUT: ${{ github.workspace }}/local-data/native-proof
      ASSETWRIGHT_NATIVE_OPERATION_PROPOSAL: ${{ github.workspace }}/local-data/zero-to-cad/native-bridge/operation.properties
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assetwright-zero-to-cad-dinov2-research
          path: local-data/zero-to-cad
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Install Android JVM test SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Generate genuine native GLBs from research-only typed operator proposal
        run: |
          test -f "$ASSETWRIGHT_NATIVE_OPERATION_PROPOSAL"
          gradle :app:testDebugUnitTest --rerun-tasks --stacktrace
      - name: Independently audit connected blind socket topology and GLB hashes
        run: |
          python tools/mini_ai/native_socket_audit.py \
            --source local-data/native-proof \
            --out local-data/native-proof/evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: assetwright-zero-to-cad-native-geometry-proof
          path: |
            local-data/native-proof/*.glb
            local-data/native-proof/*.json
            local-data/zero-to-cad/native-bridge/*.json
          if-no-files-found: error
          retention-days: 21
