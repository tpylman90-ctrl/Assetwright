name: Code-to-Blender | Real Blender GLB and Six-View Renders

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/blender/inbox/current.py'
      - 'tools/blender/render_inbox.py'
      - '.github/workflows/code-to-blender.yml'

permissions:
  contents: write

concurrency:
  group: assetwright-code-to-blender
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Blender 4.5.3 and image utilities
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri python3-pil
          curl -fL --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-4.5.3-linux-x64/blender --version | head -n 2

      - name: Build user geometry in Blender and export the native outputs
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          mkdir -p generated/code_to_blender
          xvfb-run -a /tmp/blender-4.5.3-linux-x64/blender \
            --background --factory-startup --threads 4 --python-exit-code 1 \
            --python tools/blender/render_inbox.py \
            2>&1 | tee generated/code_to_blender/blender.log
          grep -q CODE_TO_BLENDER_ALL_OK generated/code_to_blender/blender.log
          test -s generated/code_to_blender/scifi_hovercraft_blender.glb
          test -s generated/code_to_blender/scifi_hovercraft_master.blend
          for view in front_3q rear_3q left_side top front rear; do
            test -s "generated/code_to_blender/scifi_hovercraft_$view.png"
          done

      - name: Assemble downloadable six-view contact sheet and verify dimensions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path("generated/code_to_blender")
          labels=[("front_3q","FRONT 3/4"),("rear_3q","REAR 3/4"),("left_side","LEFT SIDE"),("top","TOP"),("front","FRONT"),("rear","REAR")]
          sheet=Image.new("RGB",(960*3, (720+48)*2),(32,35,40))
          d=ImageDraw.Draw(sheet)
          for i,(key,label) in enumerate(labels):
              img=Image.open(root/("scifi_hovercraft_"+key+".png")).convert("RGB")
              assert img.size==(960,720),img.size
              x=(i%3)*960;y=(i//3)*768
              sheet.paste(img,(x,y))
              d.text((x+20,y+724),label,fill=(235,238,242))
          sheet.save(root/"scifi_hovercraft_six_views.png")
          audit=json.loads((root/"scifi_hovercraft_audit.json").read_text())
          assert audit["part_count"]==8
          assert audit["evaluated_triangles"]>500
          print("CODE_TO_BLENDER_SIX_VIEW_SHEET_OK")
          PY

      - name: Upload native Blender master, GLB, PNGs and audit logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SciFi-Hovercraft-Blender-45-Native
          path: generated/code_to_blender/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish directly downloadable GLB, Blender file and PNGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="code-blender-$(echo "$GITHUB_SHA" | cut -c1-10)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              generated/code_to_blender/*.glb generated/code_to_blender/*.blend \
              generated/code_to_blender/*.png generated/code_to_blender/*audit.json \
              --clobber
          else
            gh release create "$tag" \
              generated/code_to_blender/*.glb generated/code_to_blender/*.blend \
              generated/code_to_blender/*.png generated/code_to_blender/*audit.json \
              --title "Sci-Fi Hovercraft — native Blender 4.5.3" \
              --notes "Generated by Blender 4.5.3 from the user's BMesh script. Includes fully evaluated GLB, editable Blender master, six inspection images, and geometry audit." \
              --target "$GITHUB_SHA"
          fi
          echo "DIRECT_DOWNLOAD_RELEASE=https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
