name: Forge Mini — Geometry-Aware Deep Learning v5

# Genuine cumulative neural learning from previous verified weights,
# old-source rehearsal (including valid lessons from rejected v4),
# and three FAIR equal-budget experiments on original Kotlin geometry.
# ZERO automatic production or Android model promotion.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forge-mini-geometry-aware-v5.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: assetwright-native-geometry-aware-v5
  cancel-in-progress: false

jobs:
  new-native-geometry-school:
    name: Generate 716 novel original GLBs and verify fresh development/blind geometry families
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      ASSETWRIGHT_DINO_STUDY: geometry_aware_v5
      ASSETWRIGHT_GEOMETRY_AWARE_SOURCE: ${{ github.workspace }}/local-data/geometry_aware/new/source
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Verify independent v5 geometry families and tests for real promotion, not benchmark cosmetics
        run: |
          python -m unittest discover -s tools/mini_ai -p 'test_native_geometry_aware_v5.py'
      - name: Free Android SDK to execute OUR original Kotlin advanced-forms generator
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Export 716 fresh original indexed closed GLBs with known operation + physical strength
        run: |
          gradle :app:testDebugUnitTest \
            --tests com.assetwright.app.mini.DinoGeometryAwareBatchTest \
            --rerun-tasks --stacktrace
          test "$(find local-data/geometry_aware/new/source -maxdepth 1 -name '*.glb' | wc -l)" -eq 716
      - name: Install only free neutral rendering requirements, NO pretrained DINO teacher
        run: python -m pip install 'Pillow==11.3.0' 'numpy>=1.26,<3'
      - name: Verify topology and render exactly 1432 source-matched two-view images
        run: |
          python tools/mini_ai/dino_delta_school.py render \
            --source local-data/geometry_aware/new/source \
            --images local-data/geometry_aware/new/images \
            --out local-data/geometry_aware/new/manifest.json
      - name: Reject old inspected validation families, duplicate sources or outside meshes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('local-data/geometry_aware/new/manifest.json').read_text())
          assert m['study_id']=='geometry_aware_v5'
          assert m['source_count']==716 and m['paired_examples']==696
          assert m['external_geometry_used'] is False
          counts={k:sum(x['split']==k for x in m['records'])
                  for k in ('train','development','validation')}
          assert counts=={'train':504,'development':96,'validation':96}
          assert {x['family'] for x in m['records'] if x['split']=='validation'}==\
              {'bg_blind01','bg_blind02','bg_blind03','bg_blind04'}
          print('New native source family holdouts audited',flush=True)
          PY
      - name: Save all 716 original Kotlin geometry sources and matching renders
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-mini-v5-716-new-original-geometry
          path: local-data/geometry_aware/new/
          if-no-files-found: warn
          retention-days: 45

  real-3d-gradients-and-continuation:
    name: 30 actual CPU minutes, 3 methods, prior replay, 384 real GLBs, permanent learned weights
    needs: new-native-geometry-school
    runs-on: ubuntu-24.04
    timeout-minutes: 68
    env:
      ASSETWRIGHT_DINO_STUDY: geometry_aware_v5
      ASSETWRIGHT_GEOMETRY_AWARE_PREDICTIONS: ${{ github.workspace }}/local-data/geometry_aware/student/native_proposals.properties
      ASSETWRIGHT_GEOMETRY_AWARE_RECON: ${{ github.workspace }}/local-data/geometry_aware/reconstructed
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: forge-mini-v5-716-new-original-geometry
          path: local-data/geometry_aware/new/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Download historical VERIFIED original Kotlin training sources, not just accuracy scores
        run: |
          test -s training/knowledge/native_strength_teacher_free_42080318206/owned_native_student.safetensors
          mkdir -p local-data/geometry_aware/old_v3
          mkdir -p local-data/geometry_aware/old_v4
          gh run download 42080318206 --repo "$GITHUB_REPOSITORY" \
            --name assetwright-marathon-888-own-GLBs-and-teacher \
            --dir local-data/geometry_aware/old_v3
          gh run download 42122117108 --repo "$GITHUB_REPOSITORY" \
            --name forge-mini-continual-716-new-original-GLBs \
            --dir local-data/geometry_aware/old_v4
          test -s local-data/geometry_aware/old_v3/manifest.json
          test -s local-data/geometry_aware/old_v4/manifest.json
          test "$(find local-data/geometry_aware/old_v3/source -maxdepth 1 -name '*.glb' | wc -l)" -eq 888
          test "$(find local-data/geometry_aware/old_v4/source -maxdepth 1 -name '*.glb' | wc -l)" -eq 716
      - name: Install actual CPU PyTorch and source-hashed native vertex reading
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          python -m pip install 'Pillow==11.3.0' 'numpy>=1.26,<3' 'safetensors>=0.4,<1'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Prove actual original source-hashed weights load and vertex loss backpropagates
        run: |
          python -m unittest discover -s tools/mini_ai -p 'test_native_studied_warm_start.py'
          python -m unittest discover -s tools/mini_ai -p 'test_native_geometry_aware_v5.py'
      - name: RELOAD real prior weights and optimize equally across 3 methods for 1800 active seconds
        run: |
          python -u tools/mini_ai/native_geometry_aware_student.py \
            --new-manifest local-data/geometry_aware/new/manifest.json \
            --new-images local-data/geometry_aware/new/images \
            --new-source local-data/geometry_aware/new/source \
            --v3-manifest local-data/geometry_aware/old_v3/manifest.json \
            --v3-images local-data/geometry_aware/old_v3/images \
            --v3-source local-data/geometry_aware/old_v3/source \
            --v4-manifest local-data/geometry_aware/old_v4/manifest.json \
            --v4-images local-data/geometry_aware/old_v4/images \
            --v4-source local-data/geometry_aware/old_v4/source \
            --knowledge training/knowledge/native_strength_teacher_free_42080318206 \
            --out local-data/geometry_aware/student \
            --training-seconds 1800
      - name: Independently execute 384 REAL Kotlin AdvancedFormLab native GLBs
        run: |
          test -s "$ASSETWRIGHT_GEOMETRY_AWARE_PREDICTIONS"
          gradle :app:testDebugUnitTest \
            --tests com.assetwright.app.mini.DinoGeometryAwareReconstructionTest \
            --rerun-tasks --stacktrace
          test "$(find local-data/geometry_aware/reconstructed -maxdepth 1 -name '*.glb' | wc -l)" -eq 384
      - name: Full source-hash, topology and vertex-distortion audit against parent and 3 trained methods
        run: |
          python tools/mini_ai/native_geometry_aware_forward_audit.py \
            --source local-data/geometry_aware/new/source \
            --reconstructed local-data/geometry_aware/reconstructed \
            --out local-data/geometry_aware/forward_audit.json
      - name: Accept only demonstrated real 3D improvement with no forgetting and no blind selection
        run: |
          python tools/mini_ai/native_geometry_aware_acceptance.py \
            --evaluation local-data/geometry_aware/student/evaluation.json \
            --forward local-data/geometry_aware/forward_audit.json \
            --lineage local-data/geometry_aware/student/lineage.json \
            --out local-data/geometry_aware/student/research_disposition.json
      - name: Persist all 3 actually learned neural models with original GLB proof regardless of gate outcome
        run: |
          python tools/mini_ai/retain_geometry_aware_learning.py \
            --local local-data/geometry_aware \
            --original training/knowledge/native_strength_teacher_free_42080318206 \
            --permanent "training/learning_runs/geometry_aware_v5_$GITHUB_RUN_ID" \
            --run-id "$GITHUB_RUN_ID"
          git config user.name "AssetWright native learning bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "training/learning_runs/geometry_aware_v5_$GITHUB_RUN_ID"
          git commit -m "research: retain geometry-aware learned weights and 384 own native GLB tests [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:refs/heads/main
      - name: Always retain research student weights, 3D reconstructions and honest disposition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-mini-v5-geometry-training-three-methods-and-384-GLBs
          path: |
            local-data/geometry_aware/student/*.json
            local-data/geometry_aware/student/*.properties
            local-data/geometry_aware/student/winners/*.safetensors
            local-data/geometry_aware/student/sessions/*.safetensors
            local-data/geometry_aware/forward_audit.json
            local-data/geometry_aware/reconstructed/*.glb
            local-data/geometry_aware/reconstructed/*.json
            training/learning_runs/geometry_aware_v5_*/**
          if-no-files-found: warn
          retention-days: 45
