name: AssetWright CAD Surface Teacher — Fresh Validation Cohort B

# First 416-source run FAILED before training because a signed numeric
# descriptor legitimately equaled -1.0. Its validation offset 1700 is retired.
# Reuse the exact original 320-source TRAIN (not the exposed validation).
# Run new official validation at offset 2600 with UNCHANGED model thresholds.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cad-surface-transfer-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fresh-surface-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '41958208141'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open numeric and licensed dataset readers
        run: python -m pip install 'datasets>=3.0,<5.0' 'numpy==2.1.3'
      - name: Verify source STL integrity rules and negative literal regression
        run: |
          python -m unittest discover -s tools/mini_ai -p test_cad_surface_transfer.py -v
      - name: Recover original 320-source training data without any retuning
        run: |
          mkdir -p local-data/cad-surfaces
          gh run download "$SOURCE_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name assetwright-cad-real-stl-surface-teacher \
            --dir local-data/cad-surfaces
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('local-data/cad-surfaces')
          train=json.loads((root/'train.json').read_text())
          assert train['accepted']==320
          assert train['official_split']=='train'
          assert train['source_offset']==2300
          assert train['dataset_revision']=='48bcf0a8c6fbfb47a27f5662007c24dff8d754ae'
          assert train['downloaded_scripts_executed'] is False
          assert train['downloaded_meshes_exported_as_native'] is False
          assert len({r['code_sha256'] for r in train['records']})==320
          assert len({r['stl_sha256'] for r in train['records']})==320
          (root/'validation.json').unlink()
          print('Reused the exact original source-hashed training split only')
          PY
      - name: Measure 96 genuinely new official CAD STL validation shapes
        run: |
          python tools/mini_ai/cad_surface_teacher.py \
            --split validation \
            --revision "$(cat local-data/cad-surfaces/revision.txt)" \
            --offset 2600 --count 96 --scan-limit 520 \
            --out local-data/cad-surfaces/validation.json
      - name: Fit source-only owned student; evaluate once on fresh heldout
        run: |
          python tools/mini_ai/cad_surface_student.py \
            --train local-data/cad-surfaces/train.json \
            --validation local-data/cad-surfaces/validation.json \
            --out local-data/cad-surfaces/student
      - name: Audit owned geometry authority and validated source separation
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('local-data/cad-surfaces/student')
          m=json.loads((p/'candidate_surface_student.json').read_text())
          r=json.loads((p/'evaluation.json').read_text())
          assert r['status']=='validated_research_surface_teacher'
          assert r['validation_offset']==2600
          assert all(r['precommitted_checks'].values())
          assert r['actually_generated_native_GLBS']==0
          assert m['outside_mesh_generator'] is False
          assert m['android_deployable'] is False
          assert m['allowed_for_native_geometry'] is False
          PY
      - name: Retain successful or REJECTED source-geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assetwright-cad-surface-transfer-fresh-cohort-b
          path: |
            local-data/cad-surfaces/revision.txt
            local-data/cad-surfaces/train.json
            local-data/cad-surfaces/validation.json
            local-data/cad-surfaces/student/*.json
          if-no-files-found: warn
          retention-days: 30
