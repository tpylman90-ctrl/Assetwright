name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/android.yml'
      - 'tools/mini_ai/generated_glb_critic.py'
      - 'tools/mini_ai/generator_quality_loop.py'
      - 'tools/mini_ai/vehicle_design_critic.py'
      - 'tools/mini_ai/test_generated_glb_critic.py'
      - 'tools/mini_ai/test_vehicle_design_critic.py'
      - 'training/reviews/vehicle_visual_feedback.json'
      - 'training/curricula/vehicle_modeling_techniques.json'
      - 'tools/mini_ai/technique_teacher.py'
      - 'tools/mini_ai/technique_effect_audit.py'
      - 'tools/mini_ai/test_technique_teacher.py'
      - 'tools/mini_ai/test_technique_effect_audit.py'
      - 'tools/mini_ai/native_socket_audit.py'
      - 'tools/mini_ai/test_zero_to_cad_native_bridge.py'
      - 'tools/mini_ai/test_native_composition_student.py'
      - 'tools/mini_ai/zero_to_cad_native_bridge.py'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ASSETWRIGHT_BENCHMARK_OUT: ${{ github.workspace }}/local-data/generator-benchmark
      ASSETWRIGHT_SOCKET_BENCHMARK_OUT: ${{ github.workspace }}/local-data/socket-benchmark
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"

      - name: Accept licenses and install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify Forge learning lessons and training tools
        run: |
          set -o pipefail
          (python tools/mini_ai/check_forge_lessons.py && python -m unittest discover -s tools/mini_ai -p "test_*.py") 2>&1 | tee python-tests.log

      - name: Test native offline Mini AI and build debug APK
        run: |
          set -o pipefail
          # Native generated GLBs are deliberately written as a test-side artifact.
          # Running from Gradle's build cache would skip that export, creating an
          # empty benchmark that falsely looks like a generator failure.
          gradle :app:testDebugUnitTest :app:assembleDebug --rerun-tasks --stacktrace 2>&1 | tee gradle-build.log

      - name: Independent structural and modeling-technique audit of 40 real generated GLBs
        run: |
          python tools/mini_ai/generator_quality_loop.py \
            --source local-data/generator-benchmark \
            --out local-data/generator-results/evaluation.json

      - name: Verify real connected rear socket in two original native GLBs
        run: |
          python tools/mini_ai/native_socket_audit.py \
            --source local-data/socket-benchmark \
            --out local-data/socket-results/evaluation.json

      - name: Teach modeling-operation selection from verified original recipes
        run: |
          python tools/mini_ai/technique_teacher.py \
            --curriculum training/curricula/vehicle_modeling_techniques.json \
            --out local-data/technique-learning/selector

      - name: Verify before-after effects on actual Android-generated GLBs
        run: |
          python tools/mini_ai/technique_effect_audit.py \
            --curriculum training/curricula/vehicle_modeling_techniques.json \
            --benchmark local-data/generator-results/evaluation.json \
            --out local-data/technique-learning/effects.json

      - name: Upload original generated benchmark GLBs and evaluation
        uses: actions/upload-artifact@v4
        with:
          name: assetwright-real-glb-generator-benchmark
          path: |
            local-data/generator-benchmark/*.glb
            local-data/generator-benchmark/*.json
            local-data/generator-results/*.json
            local-data/socket-benchmark/*.glb
            local-data/socket-benchmark/*.json
            local-data/socket-results/*.json
            local-data/technique-learning/selector/*.json
            local-data/technique-learning/effects.json
          if-no-files-found: error
          retention-days: 21

      - name: Publish concise failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          log = "\n".join(p.read_text(errors="replace")[-60000:] for p in
              (Path("python-tests.log"), Path("gradle-build.log")) if p.exists())
          lines = log.splitlines()
          patterns = [
              r"^e: .*", r"^.*: error: .*", r"^.*\berror: .*",
              r"^FAILURE: .*", r"^\s*\w+Error: .*",
              r"^E\s+.*", r"^\s*\d+\) .*FAILED", r"^.*FAILED \(.*",
              r"^.*Could not (?:resolve|find|determine).*",
          ]
          hits = [line.strip() for line in lines
              if any(re.search(p, line, re.I) for p in patterns)]
          message = next((h for h in hits if not h.startswith("FAILURE:")), None)
          if not message:
              message = hits[0] if hits else "Build failed; see Actions job logs"
          message = re.sub(r"\s+", " ", message)[:130]
          Path("failure-summary.txt").write_text(message)
          print("Failure summary:", message)
          PY
          message=$(cat failure-summary.txt)
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             -f state=failure -f context="assetwright/build-diagnostic"             -f description="$message"             -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: assetwright-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Decode upload key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' }}
        run: |
          KEY_PATH="$RUNNER_TEMP/assetwright-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' }}
        run: gradle :app:assembleRelease

      - name: Upload signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: assetwright-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Mark verified Android APK build
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context="assetwright/android-apk" -f description="Unit tests passed; debug APK uploaded as artifact" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
