name: AssetWright DINO Before and After Native Learning

# New non-reused source families. Fresh research only; no Android promotion.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dino-before-after-native-learning.yml'
      - 'app/src/test/java/com/assetwright/app/mini/DinoDeltaGeometryBatchTest.kt'
      - 'app/src/test/java/com/assetwright/app/mini/DinoDeltaReconstructionTest.kt'
      - 'tools/mini_ai/dino_delta_*.py'
      - 'tools/mini_ai/test_dino_delta_*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assetwright-dino-paired-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-source-safety:
    name: Test original paired sources, split integrity, no data leaks and promotion gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal CPU test dependencies
        run: python -m pip install 'Pillow==11.3.0' 'numpy>=1.26,<3'
      - name: Test before/after visual difference and source integrity
        run: python -m unittest discover -s tools/mini_ai -p 'test_dino_delta_school.py'
      - name: Test impossible-to-bypass Android promotion guard
        run: python -m unittest discover -s tools/mini_ai -p 'test_dino_delta_acceptance.py'

  geometry-change-student:
    name: Original Kotlin GLBs to frozen DINO differences to owned native reconstructions
    needs: original-source-safety
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ASSETWRIGHT_DINO_DELTA_SOURCE: ${{ github.workspace }}/local-data/dino-delta/source
      ASSETWRIGHT_DINO_DELTA_PREDICTIONS: ${{ github.workspace }}/local-data/dino-delta/student/native_proposals.properties
      ASSETWRIGHT_DINO_DELTA_RECON: ${{ github.workspace }}/local-data/dino-delta/reconstructed
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Prepare free Android JVM SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Export 486 ORIGINAL Kotlin native GLBs from protected fresh families
        run: |
          gradle :app:testDebugUnitTest \
            --tests com.assetwright.app.mini.DinoDeltaGeometryBatchTest \
            --rerun-tasks --stacktrace
          test "$(find local-data/dino-delta/source -maxdepth 1 -name '*.glb' | wc -l)" -eq 486
      - name: Install free CPU DINOv2 teacher and from-scratch original-student dependencies
        run: |
          python -m pip install --upgrade 'Pillow==11.3.0' 'numpy>=1.26,<3' 'transformers>=4.45,<5' 'safetensors>=0.4,<1'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Audit 486 native GLBs and create aligned before/after camera views
        run: |
          python tools/mini_ai/dino_delta_school.py render \
            --source local-data/dino-delta/source \
            --images local-data/dino-delta/images \
            --out local-data/dino-delta/manifest.json
      - name: Frozen DINOv2 teaches 468 independent native shape deltas
        run: |
          python tools/mini_ai/dino_delta_school.py teach \
            --manifest local-data/dino-delta/manifest.json \
            --images local-data/dino-delta/images \
            --out local-data/dino-delta/frozen_dino_delta_teacher.json
      - name: Train after-only, paired and DINO-guided original native students
        run: |
          python tools/mini_ai/dino_delta_student.py \
            --manifest local-data/dino-delta/manifest.json \
            --teacher local-data/dino-delta/frozen_dino_delta_teacher.json \
            --images local-data/dino-delta/images \
            --out local-data/dino-delta/student
      - name: Reconstruct 108 genuine Kotlin GLBs from our own two students
        run: |
          test -s "$ASSETWRIGHT_DINO_DELTA_PREDICTIONS"
          gradle :app:testDebugUnitTest \
            --tests com.assetwright.app.mini.DinoDeltaReconstructionTest \
            --rerun-tasks --stacktrace
          test "$(find local-data/dino-delta/reconstructed -maxdepth 1 -name '*.glb' | wc -l)" -eq 108
      - name: Audit actual native reconstruction against unchanged and teacher-free baselines
        run: |
          python tools/mini_ai/dino_delta_forward_audit.py \
            --source local-data/dino-delta/source \
            --reconstructed local-data/dino-delta/reconstructed \
            --out local-data/dino-delta/forward_audit.json
      - name: Gate source-hash-matched visual and real-geometry improvements
        run: |
          python tools/mini_ai/dino_delta_acceptance.py \
            --visual local-data/dino-delta/student/evaluation.json \
            --forward local-data/dino-delta/forward_audit.json \
            --model local-data/dino-delta/student/candidate_student.json \
            --out local-data/dino-delta/student
      - name: Preserve exact original sources, view evidence and honest rejection or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assetwright-dino-before-after-486-original-native-glbs
          path: |
            local-data/dino-delta/source/*.glb
            local-data/dino-delta/source/*.json
            local-data/dino-delta/images/*.png
            local-data/dino-delta/manifest.json
            local-data/dino-delta/frozen_dino_delta_teacher.json
            local-data/dino-delta/student/*.json
            local-data/dino-delta/student/*.properties
            local-data/dino-delta/reconstructed/*.glb
            local-data/dino-delta/reconstructed/*.json
            local-data/dino-delta/forward_audit.json
          if-no-files-found: warn
          retention-days: 30
