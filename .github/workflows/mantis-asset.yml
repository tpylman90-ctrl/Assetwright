name: Mantis MK I training asset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/blender/generate_mantis.py"
      - ".github/workflows/mantis-asset.yml"

permissions:
  contents: read

concurrency:
  group: mantis-training-asset
  cancel-in-progress: true

jobs:
  build-mantis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install --yes blender libegl1 libgl1 python3-numpy
          blender --version

      - name: Build one Mantis training asset
        run: |
          blender --background --factory-startup --python-exit-code 1 \
            --python tools/blender/generate_mantis.py \
            -- --output-dir generated/mantis
          test -s generated/mantis/mantis_mk1.glb
          test -s generated/mantis/mantis_mk1_review_board.png
          test -s generated/mantis/mantis_mk1_lod1.glb
          test -s generated/mantis/mantis_mk1_lod2.glb
          test -s generated/mantis/mantis_mk1_collision.glb
          test -s generated/mantis/mantis_mk1_rear_3q.png
          test -s generated/mantis/mantis_mk1_chase.png
          python3 -m json.tool generated/mantis/mantis_mk1_training_record.json > /dev/null
          python3 - <<'PY'
          import json, os, struct
          root = "generated/mantis"
          record = json.load(open(root + "/mantis_mk1_training_record.json"))
          target = record["game_target"]
          checks = [
              ("mantis_mk1.glb", target["triangle_count"], 120000),
              ("mantis_mk1_lod1.glb", target["lods"]["LOD1"], 45000),
              ("mantis_mk1_lod2.glb", target["lods"]["LOD2"], 20000),
              ("mantis_mk1_collision.glb", target["collision_triangles"], 1000),
          ]
          for name, expected, budget in checks:
              raw = open(root + "/" + name, "rb").read()
              magic, version, total = struct.unpack_from("<4sII", raw)
              assert magic == b"glTF" and version == 2 and total == len(raw), name
              length, kind = struct.unpack_from("<II", raw, 12)
              assert kind == 0x4e4f534a, name
              data = json.loads(raw[20:20+length])
              triangles = 0
              for mesh in data.get("meshes", []):
                  for primitive in mesh["primitives"]:
                      assert primitive.get("mode", 4) == 4, name
                      accessor = data["accessors"][primitive["indices"]]
                      triangles += accessor["count"] // 3
              assert 0 < triangles == expected <= budget, (name, triangles, expected)
              assert not any(n.get("name") == "Preview floor" for n in data.get("nodes", []))
              print(name, triangles, "triangles;", len(raw), "bytes")
          PY

      - name: Upload Mantis model, review views, and training record
        uses: actions/upload-artifact@v4
        with:
          name: assetwright-mantis-mk1
          path: generated/mantis/
          if-no-files-found: error
          retention-days: 3
