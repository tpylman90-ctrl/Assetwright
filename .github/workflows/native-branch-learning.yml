name: AssetWright Native Branch Placement and Junction Learning

# Original synthetic evaluation source families were fixed before the
# experiment at commit a4248753. After the first run they are historical
# research evidence, NOT unexposed blind test sets for future tuning.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ASSETWRIGHT_BRANCH_SOURCE: ${{ github.workspace }}/local-data/branch/source
      ASSETWRIGHT_BRANCH_PREDICTIONS: ${{ github.workspace }}/local-data/branch/evaluation/student_branch_commands.tsv
      ASSETWRIGHT_BRANCH_RECON: ${{ github.workspace }}/local-data/branch/reconstructed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only free numerical and diagnostic rendering packages
        run: python -m pip install 'numpy==2.1.3' 'Pillow==11.3.0'
      - name: Test 20-way student and fail-closed training controls
        run: python -m unittest discover -s tools/mini_ai -p 'test_native_branch_student.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Prepare JVM Kotlin native geometry runtime
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Produce 520 original connected branch GLBs from Kotlin
        run: |
          gradle :app:testDebugUnitTest \
            --tests com.assetwright.app.mini.NativeBranchLabTest \
            --tests com.assetwright.app.mini.NativeInterfaceLabTest \
            --rerun-tasks --stacktrace
          test "$(find local-data/branch/source -maxdepth 1 -name '*.glb' | wc -l)" -eq 520
      - name: Independently audit actual GLB topology and train native spatial learner
        run: |
          python tools/mini_ai/native_branch_student.py \
            --source local-data/branch/source \
            --out local-data/branch/evaluation
      - name: Rebuild 160 unseen student-predicted branches in original Kotlin
        run: |
          gradle :app:testDebugUnitTest \
            --tests com.assetwright.app.mini.NativeBranchReconstructionTest \
            --rerun-tasks --stacktrace
      - name: Verify source hashes, real joined topology and forward surface error
        run: |
          python tools/mini_ai/audit_native_branch_reconstruction.py \
            --source local-data/branch/source \
            --reconstructed local-data/branch/reconstructed \
            --out local-data/branch/evaluation/forward_branch_audit.json
      - name: Produce 80 original clay/wire diagnostics requiring human approval
        if: success()
        run: |
          python tools/mini_ai/render_native_branch_review.py \
            --source local-data/branch/source \
            --reconstructed local-data/branch/reconstructed \
            --out local-data/branch/previews
      - name: Preserve original sources and every failed/successful proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assetwright-connected-branch-source-and-learning
          path: |
            local-data/branch/source/*.glb
            local-data/branch/source/*.json
            local-data/branch/reconstructed/*.glb
            local-data/branch/reconstructed/*.sha256
            local-data/branch/evaluation/*
            local-data/branch/previews/*.png
            local-data/branch/previews/*.json
          if-no-files-found: warn
          retention-days: 21
