name: Forge Mini v9 — Archive Already-Trained Weights & Physical Evaluation

# Six v9 sessions (1800s), 1152 Kotlin GLBs, and an independently
# evaluated 3D Chamfer audit were completed in run 42445878521.
# That run failed AFTER evaluation on a CLI spelling mismatch.
# Recover exact previous artifacts and preserve source-hashed research.
# NO retraining and NO recalculation or post-hoc method selection.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forge-mini-v9-archive-finished-training.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: assetwright-v9-finished-training-archive
  cancel-in-progress: false

jobs:
  preserve-research-without-retraining:
    name: Validate and durably save 1800s v9 learned weights and 1152 3D GLBs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASSETWRIGHT_DINO_STUDY: identity_continuation_v9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free original 3D audit dependencies, not Torch training
        run: python -m pip install 'Pillow==11.3.0' 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Restore exact 1824 original Kotlin form shapes, no re-generation
        uses: actions/download-artifact@v4
        with:
          name: forge-mini-v9-1824-original-eight-form-sources
          repository: tpylman90-ctrl/Assetwright
          run-id: 42445286271
          github-token: ${{ github.token }}
          path: local-data/identity_continuation_v9/new/
      - name: Restore six independently learned checkpoints and 1152 real GLBs
        uses: actions/download-artifact@v4
        with:
          name: forge-mini-v9-cumulative-original-identity-training-and-1152-GLBs
          repository: tpylman90-ctrl/Assetwright
          run-id: 42445878521
          github-token: ${{ github.token }}
          path: recovered-original-v9/
      - name: Confirm old real training and physically scored GLB assets are intact
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          data=Path("local-data/identity_continuation_v9")
          assert len(list((data/"new/source").glob("*.glb")))==1824
          manifest=json.loads((data/"new/manifest.json").read_text())
          assert manifest["study_id"]=="identity_continuation_v9"
          assert manifest["source_count"]==1824
          assert manifest["paired_examples"]==1728
          assert manifest["external_geometry_used"] is False
          root=Path("recovered-original-v9")
          evaluations=list(root.rglob("evaluation.json"))
          assert len(evaluations)==1, evaluations
          training=evaluations[0].parent
          e=json.loads(evaluations[0].read_text())
          assert e["schema"]=="assetwright-original-shape-identity-continuation-v9"
          assert e["study"]=="identity_continuation_v9"
          assert e["optimizer_active_seconds"]>=1800
          assert e["completed_independent_sessions"]==6
          assert e["development_only_method_selected"]=="replay_continuation"
          assert e["warm_started_from_existing_neural_weights"] is True
          assert e["fresh_blind_new_native_transformations"]==288
          aud=list(root.rglob("forward_audit.json"))
          assert len(aud)==1, aud
          geometry=json.loads(aud[0].read_text())
          assert geometry["source_blind_native_shapes"]==288
          assert geometry["real_student_generated_GLBS"]==1152
          assert geometry["source_hashes_sha256"]==e["new_blind_source_sha256"]
          reconstructed=[x for x in root.rglob("reconstructed")
                         if len(list(x.glob("*.glb")))==1152]
          assert len(reconstructed)==1, reconstructed
          shutil.copytree(training,data/"student",dirs_exist_ok=True)
          shutil.copytree(reconstructed[0],data/"reconstructed",dirs_exist_ok=True)
          shutil.copyfile(aud[0],data/"forward_audit.json")
          assert (data/"student/research_disposition.json").exists()
          for method in ("replay_continuation","contrastive_continuation","spindle_truss_focus"):
              assert (data/"student/winners"/(method+".safetensors")).is_file()
          print("Restored source-hashed learned v9 checkpoints and GLB evidence without training",flush=True)
          PY
      - name: Revalidate original research gate without altering development-selected candidate
        run: |
          python tools/mini_ai/native_identity_continuation_acceptance.py \
            --evaluation local-data/identity_continuation_v9/student/evaluation.json \
            --forward local-data/identity_continuation_v9/forward_audit.json \
            --lineage local-data/identity_continuation_v9/student/lineage.json \
            --out local-data/identity_continuation_v9/student/research_disposition.json
      - name: Permanently commit all original v9 real learned weights and hash lineage
        run: |
          python tools/mini_ai/retain_identity_continuation_v9.py \
            --work local-data/identity_continuation_v9 \
            --old training/learning_runs/multiform_v6_42151392636 \
            --teacher-dir training/learning_runs/shape_identity_v7_42233349361 \
            --out training/learning_runs/identity_continuation_v9_42445878521 \
            --run-id 42445878521
          git config user.name "AssetWright original cumulative learning archive"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/learning_runs/identity_continuation_v9_42445878521
          git commit -m "research: preserve genuine v9 1800-second training and 1152 original GLB geometry evidence [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:refs/heads/main
      - name: Preserve recovered learned weights and complete research disposition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-mini-v9-recovered-learning-and-3d-verdict
          path: |
            local-data/identity_continuation_v9/student/*.json
            local-data/identity_continuation_v9/student/winners/*.safetensors
            local-data/identity_continuation_v9/forward_audit.json
            training/learning_runs/identity_continuation_v9_42445878521/**
          if-no-files-found: warn
          retention-days: 45
