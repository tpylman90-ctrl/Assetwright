name: AssetWright Native Three-Operation Composition Research

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/assetwright/app/mini/NativeCompositionLab.kt'
      - 'app/src/test/java/com/assetwright/app/mini/NativeCompositionBatchTest.kt'
      - 'app/src/test/java/com/assetwright/app/mini/NativeCompositionReconstructionTest.kt'
      - 'tools/mini_ai/native_composition_student.py'
      - 'tools/mini_ai/test_native_composition_student.py'
      - 'tools/mini_ai/audit_native_composition_reconstruction.py'
      - 'tools/mini_ai/render_composition_review.py'
      - '.github/workflows/native-composition-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composition-study:
    name: Train 3-step programs from 1120 original source-hashed GLBs
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ASSETWRIGHT_COMPOSED_OUT: ${{ github.workspace }}/local-data/native-composition/source
      ASSETWRIGHT_COMPOSED_PREDICTIONS: ${{ github.workspace }}/local-data/native-composition/evaluation/inverse_programs.tsv
      ASSETWRIGHT_COMPOSED_RECON: ${{ github.workspace }}/local-data/native-composition/reconstructed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free numeric and rendering libraries
        run: python -m pip install 'numpy==2.1.3' 'Pillow==11.3.0'
      - name: Unit test own inverse-program optimizer and failure gates
        run: |
          python -m unittest discover -s tools/mini_ai -p 'test_native_composition_student.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Prepare Android JVM test runtime
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Export 1120 original Kotlin 3-step geometries
        run: |
          gradle :app:testDebugUnitTest \
            --tests com.assetwright.app.mini.NativeCompositionBatchTest \
            --tests com.assetwright.app.mini.AdvancedFormBatchTest \
            --rerun-tasks --stacktrace
          test "$(find local-data/native-composition/source -maxdepth 1 -name '*.glb' | wc -l)" -eq 1120
      - name: Independent GLB inspection and supervised inverse-program training
        run: |
          python tools/mini_ai/native_composition_student.py \
            --source local-data/native-composition/source \
            --out local-data/native-composition/evaluation
      - name: Construct the 320 unseen predicted GLBs with OUR native Kotlin engine
        run: |
          gradle :app:testDebugUnitTest \
            --tests com.assetwright.app.mini.NativeCompositionReconstructionTest \
            --rerun-tasks --stacktrace
      - name: Independent normalized forward geometry comparison and integrity audit
        run: |
          python tools/mini_ai/audit_native_composition_reconstruction.py \
            --source local-data/native-composition/source \
            --reconstructed local-data/native-composition/reconstructed \
            --out local-data/native-composition/evaluation/forward_reconstruction_audit.json
      - name: Render original target vs student generated clay/wire views
        if: success()
        run: |
          python tools/mini_ai/render_composition_review.py \
            --source local-data/native-composition/source \
            --reconstructed local-data/native-composition/reconstructed \
            --out local-data/native-composition/previews
      - name: Always retain source GLBs, rejected candidates, audits and preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assetwright-three-operator-source-geometry-research
          path: |
            local-data/native-composition/source/*.glb
            local-data/native-composition/source/*.json
            local-data/native-composition/reconstructed/*.glb
            local-data/native-composition/reconstructed/*.sha256
            local-data/native-composition/evaluation/*
            local-data/native-composition/previews/*.png
            local-data/native-composition/previews/*.json
          if-no-files-found: warn
          retention-days: 21
